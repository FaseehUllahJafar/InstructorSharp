name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS prove the library has no Windows-only assumptions; Windows is the
        # only runner that can execute the .NET Framework leg of the test matrix.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Runs the .NET Framework assembly directly and reads its real counts. Checking that the
      # exe merely exists would pass even if no test in it ever ran, which is the failure this
      # step exists to catch: netstandard2.0 backs the package's .NET Framework claim.
      - name: Assert the .NET Framework leg actually executed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exe=tests/InstructorSharp.Tests/bin/Release/net472/InstructorSharp.Tests.exe
          if [ ! -x "$exe" ]; then
            echo "::error::net472 assembly was not built; the .NET Framework claim is unverified."
            exit 1
          fi
          output=$("$exe" -noColor)
          echo "$output"
          if ! echo "$output" | grep -qE 'Total: [1-9][0-9]*,'; then
            echo "::error::net472 ran zero tests."
            exit 1
          fi
          if ! echo "$output" | grep -q 'Failed: 0,'; then
            echo "::error::net472 tests failed."
            exit 1
          fi

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link needs the full history to resolve the commit it stamps into the package.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: >
          dotnet pack --configuration Release
          -p:IsTrimmable=true
          --output ${{ github.workspace }}/artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
