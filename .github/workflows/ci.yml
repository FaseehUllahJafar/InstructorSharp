name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS prove the library has no Windows-only assumptions; Windows is the
        # only runner that can execute the .NET Framework leg of the test matrix.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # TRX per target framework, so the .NET Framework leg's result is observable rather than
      # assumed. Checking only that the exe exists would pass even if no test in it ever ran.
      - name: Test
        run: dotnet test --no-build --configuration Release -- --report-trx

      - name: Assert the .NET Framework leg actually executed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          trx=$(find tests -path '*net472*' -name '*.trx' | head -n 1)
          if [ -z "$trx" ]; then
            echo "::error::No net472 test results. The .NET Framework claim is unverified."
            exit 1
          fi
          executed=$(grep -o 'executed="[0-9]*"' "$trx" | head -n 1 | grep -o '[0-9]*')
          echo "net472 executed ${executed:-0} tests"
          if [ "${executed:-0}" -lt 1 ]; then
            echo "::error::net472 ran zero tests."
            exit 1
          fi

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link needs the full history to resolve the commit it stamps into the package.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: >
          dotnet pack --configuration Release
          -p:IsTrimmable=true
          --output ${{ github.workspace }}/artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
